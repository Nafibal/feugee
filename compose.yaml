services:
  postgres:
    image: postgres:18-alpine
    container_name: feugee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feugee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feugee}
      POSTGRES_DB: ${POSTGRES_DB:-feugee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - feugee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feugee} -d ${POSTGRES_DB:-feugee}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  feugee-postgres:
